services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutritracker_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/bot.db
      - HTTPS_PROXY=socks5://warp:1080
    mem_limit: 256m
    depends_on:
      - warp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  warp:
    image: caomingjun/warp
    container_name: nutritracker_warp
    restart: unless-stopped
    environment:
      - WARP_SLEEP=2

  caddy:
    image: caddy:2-alpine
    container_name: nutritracker_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
